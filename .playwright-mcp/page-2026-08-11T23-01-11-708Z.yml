        - generic [ref=f5e177]:
          - heading "Entendendo o EUR/USD" [level=2] [ref=f5e178]
          - paragraph [ref=f5e179]: Conhecido no mercado como "Fiber", o EUR/USD é o par de moedas mais negociado do mundo, respondendo por cerca de um quarto do volume diário global de Forex. Sua profundidade e spreads reduzidos o tornam a referência tanto para fluxo institucional quanto de varejo.
          - heading "Principais Drivers" [level=3] [ref=f5e180]
          - paragraph [ref=f5e181]: O par funciona principalmente como um proxy para a divergência de política monetária entre o Banco Central Europeu e o Federal Reserve. Diferenciais de juros, dados de inflação da Zona Euro vs. EUA e o momentum relativo de crescimento (PMIs, PIB) conduzem a tendência de médio prazo. O EUR/USD também se move de forma inversa ao Índice Dólar (DXY), do qual o euro é o maior componente.
          - heading "Horários de Negociação & Liquidez" [level=3] [ref=f5e182]
          - paragraph [ref=f5e183]: A liquidez é mais profunda durante a sobreposição entre as sessões de Londres e Nova York (aproximadamente 13h-17h UTC), quando os spreads ficam mais apertados e o volume institucional atinge o pico. A sessão asiática tende a apresentar uma ação de preço comparativamente mais lateralizada.
          - heading "Correlações & Perfil de Volatilidade" [level=3] [ref=f5e184]
          - paragraph [ref=f5e185]: O EUR/USD normalmente apresenta volatilidade diária média menor do que pares ligados a commodities, refletindo seu status de mercado profundo e amplamente arbitrado. Ele se correlaciona inversamente com o USD/CHF e acompanha o spread entre os yields dos Bunds alemães e dos Treasuries americanos em horizontes mais longos.
