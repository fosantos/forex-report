<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Report - Professional Trading Insights</title>
    <meta name="description" content="Daily expert fundamental and technical analysis for major Forex pairs. Stay ahead of market movements.">
    <!-- Google Fonts: Inter for sleek modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. MODERN DESIGN SYSTEM & CUSTOM PROPERTIES (CSS VARIABLES)
           ========================================================================== */
        :root {
            /* Color Palette */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a; /* Slate 900 */
            --text-secondary: #475569; /* Slate 600 */
            --text-muted: #64748b; /* Slate 500 */
            
            --color-primary: #2563eb; /* Royal Blue */
            --color-primary-hover: #1d4ed8;
            --color-primary-light: #eff6ff;
            
            --color-success: #10b981; /* Emerald Green */
            --color-success-bg: #ecfdf5;
            --color-success-border: #a7f3d0;
            
            --color-danger: #ef4444; /* Rose Red */
            --color-danger-bg: #fef2f2;
            --color-danger-border: #fecaca;
            
            --color-warning: #f59e0b; /* Amber */
            --color-warning-bg: #fffbeb;
            --color-warning-border: #fde68a;
            
            --color-neutral-dark: #334155;
            --color-neutral-light: #f1f5f9;
            
            /* Typography & Shadows */
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --shadow-premium: 0 20px 25px -5px rgba(0, 0, 0, 0.07), 0 8px 10px -6px rgba(0, 0, 0, 0.07);
            
            /* Transitions */
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. BASE STYLES & RESET
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: 2rem;
        }

        a {
            color: var(--color-primary);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        a:hover {
            color: var(--color-primary-hover);
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font-family);
            transition: var(--transition-smooth);
        }

        /* Responsive Layout Container */
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        /* ==========================================================================
           3. CADASTRAL HEADER (HEADER)
           ========================================================================== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            transition: var(--transition-smooth);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Logo Brand Style */
        .brand-logo {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--color-primary);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo span {
            color: var(--text-primary);
        }

        /* Header Actions (Language selector + Donation Button) */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Elegant Language Dropdown Custom Selector */
        .lang-selector-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .lang-select {
            padding: 0.4rem 1.75rem 0.4rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            background-color: var(--color-neutral-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .lang-select:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
            background-color: #e2e8f0;
        }

        .lang-select-arrow {
            position: absolute;
            right: 0.65rem;
            pointer-events: none;
            fill: var(--text-secondary);
            width: 10px;
            height: 10px;
        }

        /* Premium Header Support Button */
        .btn-header-support {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.5rem 1rem;
            background-color: var(--color-primary-light);
            color: var(--color-primary);
            border: 1px solid rgba(37, 99, 235, 0.15);
            border-radius: 20px;
            white-space: nowrap;
        }

        .btn-header-support:hover {
            background-color: var(--color-primary);
            color: #ffffff;
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }

        .btn-header-support:active {
            transform: translateY(0);
        }

        /* ==========================================================================
           4. ADVERTISEMENT PLACEHOLDERS (CRO / MONETIZATION)
           ========================================================================== */
        .adsense-placeholder {
            margin: 1.5rem auto;
            background-color: #f1f5f9;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: var(--transition-smooth);
            position: relative;
        }

        .adsense-placeholder::before {
            content: attr(data-label);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            padding: 0.5rem;
        }

        /* Standard Ad Sizes: Responsive behavior */
        .ad-top {
            width: 100%;
            min-height: 50px;
            max-width: 320px; /* Mobile size default */
        }

        @media (min-width: 768px) {
            .ad-top {
                max-width: 728px;
                min-height: 90px; /* Desktop Leaderboard */
            }
        }

        /* Auto-hide helper if scripts inject real ads and elements aren't empty */
        .adsense-placeholder:not(:empty) {
            border: none;
            background: transparent;
            min-height: auto;
        }
        .adsense-placeholder:not(:empty)::before {
            display: none;
        }

        /* ==========================================================================
           5. HERO SECTION & TYPOGRAPHY
           ========================================================================== */
        .hero {
            text-align: center;
            margin: 1.5rem 0 2rem 0;
        }

        .hero h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.04em;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ==========================================================================
           6. MAIN SELECTOR & VALUE PROPOSITION
           ========================================================================== */
        .selector-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            transition: var(--transition-smooth);
        }

        .selector-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .selector-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .currency-select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-select {
            width: 100%;
            padding: 1rem 3rem 1rem 1.25rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            background-color: var(--color-neutral-light);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .currency-select:focus {
            border-color: var(--color-primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .currency-select-arrow {
            position: absolute;
            right: 1.25rem;
            pointer-events: none;
            fill: var(--text-primary);
            width: 16px;
            height: 16px;
        }

        /* ==========================================================================
           7. DYNAMIC FOREX REPORT LAYOUT (CRO CENTER)
           ========================================================================== */
        .report-container {
            display: none; /* Controlled via JS load */
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-premium);
            overflow: hidden;
            margin-bottom: 2rem;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Report Header */
        .report-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to bottom, #ffffff, #fafafa);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 576px) {
            .report-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .pair-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .pair-icon-wrapper {
            background-color: var(--color-primary-light);
            border-radius: 10px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-primary);
        }

        .pair-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .pair-quote {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 0.1rem;
        }

        .pair-quote span {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Bias Badges */
        .bias-badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 0.45rem 0.85rem;
            border-radius: 30px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: var(--shadow-sm);
        }

        .bias-bullish {
            background-color: var(--color-success-bg);
            color: var(--color-success);
            border: 1px solid var(--color-success-border);
        }

        .bias-bearish {
            background-color: var(--color-danger-bg);
            color: var(--color-danger);
            border: 1px solid var(--color-danger-border);
        }

        .bias-neutral-bullish {
            background-color: var(--color-warning-bg);
            color: var(--color-warning);
            border: 1px solid var(--color-warning-border);
        }

        .bias-neutral-bearish {
            background-color: #f3e8ff;
            color: #7c3aed;
            border: 1px solid #ddd6fe;
        }

        /* Report Body Sections */
        .report-body {
            padding: 1.5rem;
        }

        .report-section {
            margin-bottom: 1.75rem;
        }

        .report-section:last-of-type {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            border-left: 4px solid var(--color-primary);
            padding-left: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .section-content {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.65;
            text-align: justify;
        }

        /* Technical Grid Specs */
        .technical-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        @media (min-width: 576px) {
            .technical-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .tech-box {
            background-color: var(--color-neutral-light);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
        }

        .tech-box-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .tech-box-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Strategic Setup Card (Visual Anchor) */
        .verdict-card {
            border-radius: 12px;
            padding: 1.25rem;
            margin-top: 1rem;
            border-left: 5px solid var(--color-primary);
        }

        .verdict-card.verdict-wait {
            background-color: var(--color-warning-bg);
            border-left-color: var(--color-warning);
        }

        .verdict-card.verdict-sell {
            background-color: var(--color-danger-bg);
            border-left-color: var(--color-danger);
        }

        .verdict-card.verdict-buy {
            background-color: var(--color-success-bg);
            border-left-color: var(--color-success);
        }

        .verdict-badge {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
        }

        .verdict-badge.wait { background: #fef3c7; color: #b45309; }
        .verdict-badge.sell { background: #fee2e2; color: #b91c1c; }
        .verdict-badge.buy { background: #d1fae5; color: #047857; }

        /* Strategic Setup Card Modernized */
        .setup-trigger-card {
            background-color: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: var(--transition-smooth);
        }
        
        .setup-trigger-card:hover {
            background-color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .setup-card-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .setup-card-value {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .setup-risk-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 576px) {
            .setup-risk-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .risk-card {
            border-radius: 10px;
            padding: 1rem;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background-color: rgba(255, 255, 255, 0.65);
            transition: var(--transition-smooth);
        }
        
        .risk-card:hover {
            background-color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .stop-card {
            border-left: 4px solid var(--color-danger);
        }

        .stop-card .setup-card-value {
            color: var(--color-danger);
            font-weight: 700;
        }

        .target-card {
            border-left: 4px solid var(--color-success);
        }

        .target-card .setup-card-value {
            color: var(--color-success);
            font-weight: 700;
        }

        .ratio-bar-wrapper {
            margin: 1rem 0 0.5rem 0;
        }

        .ratio-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .ratio-bar-container {
            width: 100%;
            height: 8px;
            background-color: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .ratio-bar-fill {
            height: 100%;
            background-color: var(--color-primary);
            border-radius: 10px;
            transition: var(--transition-smooth);
        }



        /* ==========================================================================
           9. DONATION & CONVERSION BLOCK (BUY ME A COFFEE CTA)
           ========================================================================== */
        .donation-section {
            background: linear-gradient(135deg, var(--color-success-bg) 0%, #dcfce7 100%);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 16px;
            padding: 1.75rem;
            text-align: center;
            margin: 2.5rem 0;
            box-shadow: var(--shadow-md);
        }

        .donation-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .donation-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.55;
            max-width: 580px;
            margin: 0 auto 1.25rem auto;
        }

        /* Authentic Stylized Buy Me A Coffee Button */
        .btn-bmc {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.8rem 1.5rem;
            background-color: #FFDD00;
            color: #000000;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(255, 221, 0, 0.35);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .btn-bmc:hover {
            background-color: #ffea5c;
            box-shadow: 0 6px 18px rgba(255, 221, 0, 0.5);
            transform: translateY(-2px);
            color: #000000;
        }

        .btn-bmc:active {
            transform: translateY(0);
        }

        .btn-bmc svg {
            width: 22px;
            height: 22px;
        }

        /* ==========================================================================
           10. INSTITUTIONAL FOOTER & COMPLIANCE
           ========================================================================== */
        .site-footer {
            border-top: 1px solid var(--border-color);
            padding: 2.5rem 0 1.5rem 0;
            text-align: center;
        }

        .footer-disclaimer {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .footer-link {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .footer-link:hover {
            color: var(--color-primary);
            text-decoration: underline;
        }

        .footer-copyright {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ==========================================================================
           11. ACCESSIBLE MODALS FOR COMPLIANCE (ADSENSE REQUIRED)
           ========================================================================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 80%;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: var(--shadow-premium);
            border: 1px solid var(--border-color);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }

        .modal.active .modal-card {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            color: var(--text-muted);
            padding: 0.25rem;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            border-bottom: 2px solid var(--color-primary-light);
            padding-bottom: 0.5rem;
        }

        .modal-body {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .modal-body p {
            margin-bottom: 1rem;
        }

        .modal-body h4 {
            font-weight: 700;
            color: var(--text-primary);
            margin: 1.25rem 0 0.5rem 0;
        }

        .btn-modal-close {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background-color: var(--color-neutral-light);
            color: var(--text-primary);
            font-weight: 700;
            border-radius: 8px;
            text-align: center;
        }

        .btn-modal-close:hover {
            background-color: var(--border-color);
        }
    </style>
</head>
<body>

    <!-- 3. HEADER -->
    <header class="site-header">
        <div class="container header-content">
            <!-- Textual Brand Logo -->
            <a href="#" class="brand-logo" id="headerLogo">
                FOREX<span>REPORT</span>
            </a>
            
            <div class="header-actions">
                <!-- Dropdown Language Selector -->
                <div class="lang-selector-wrapper">
                    <select class="lang-select" id="langSelect" aria-label="Language Selector">
                        <option value="en">EN</option>
                        <option value="pt">PT</option>
                    </select>
                    <!-- Small SVG arrow for selector styling -->
                    <svg class="lang-select-arrow" viewBox="0 0 20 20">
                        <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />

        /* ==========================================
           C. Core Engine & State Management
           ========================================== */
        let currentLang = 'en'; // Default Language

        // Interactive Wakeup Deteção (Mobile-First Headers / Navigator)
        function initLanguageDetection() {
            // "mude para português apenas se o header for pt-br ou pt-pt"
            // Analisamos as preferências do utilizador enviadas pelo browser no cliente
            const languages = navigator.languages || [navigator.language || ''];
            let foundPT = false;
            
            for (const lang of languages) {
                const cleanLang = lang.toLowerCase();
                if (cleanLang === 'pt-br' || cleanLang === 'pt-pt') {
                    currentLang = 'pt';
                    foundPT = true;
                    break;
                }
            }
            
            // Permitir override dinâmico via URL parameters para testes rápidos de CRO (?lang=pt ou ?lang=en)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('lang')) {
                const langParam = urlParams.get('lang').toLowerCase();
                if (langParam === 'pt' || langParam === 'en') {
                    currentLang = langParam;
                }
            }
            
            // Set initial select option in UI
            document.getElementById('langSelect').value = currentLang;
        }

        // Translation Engine Renderer
        function translateUI() {
            const dictionary = i18n[currentLang];
            
            // Meta updates
            document.title = currentLang === 'pt' ? 'Relatório Forex - Análises Avançadas Gratuitas' : 'Forex Report - Professional Trading Insights';
            
            // Top Ad Text Placement
            document.getElementById('topAd').setAttribute('data-label', dictionary.adPlaceholder);
            
            // DOM static translation injection
            document.getElementById('supportHeaderBtn').textContent = dictionary.supportBtn;
            document.getElementById('heroTitle').textContent = dictionary.title;
            document.getElementById('heroSubtitle').textContent = dictionary.subtitle;
            document.getElementById('generationTime').textContent = dictionary.generatedAt;
            document.getElementById('selectorLabelText').textContent = dictionary.selectPair;
            
            // Dynamic Table / Card Labels inside report
            document.getElementById('secTitleFundamental').textContent = dictionary.fundamentalTab;
            document.getElementById('secTitleTechnical').textContent = dictionary.technicalTab;
            document.getElementById('secTitleVerdict').textContent = dictionary.verdictTab;
            
            document.getElementById('labelTrend').textContent = dictionary.trendLabel;
            document.getElementById('labelLiquidity').textContent = dictionary.liquidityLabel;
            document.getElementById('subLabelSupport').textContent = dictionary.supportLabel;
            document.getElementById('subLabelResistance').textContent = dictionary.resistanceLabel;
            document.getElementById('labelPriceAction').textContent = dictionary.priceActionLabel;
            
            document.getElementById('labelTrigger').textContent = dictionary.triggerLabel;
            document.getElementById('labelStop').textContent = dictionary.stopLabel;
            document.getElementById('labelTarget').textContent = dictionary.targetLabel;
            document.getElementById('labelRR').textContent = dictionary.rrLabel;
            document.getElementById('labelRatioProgress').textContent = currentLang === 'pt' ? 'SIMETRIA RISCO / RETORNO' : 'RISK / REWARD SYMMETRY';
            document.getElementById('labelJustification').textContent = dictionary.justificationLabel;
            
            // Donation Area translations
            document.getElementById('supportTitleText').textContent = dictionary.supportTitle;
            document.getElementById('supportDescText').textContent = dictionary.supportDesc;
            document.getElementById('bmcBtnText').textContent = dictionary.bmcBtn;
            
            // Footer compliance
            document.getElementById('footerDisclaimerText').textContent = dictionary.footerDisclaimer;
            document.getElementById('disclaimerLinkText').textContent = dictionary.disclaimerLink;
            document.getElementById('privacyLinkText').textContent = dictionary.privacyLink;
            document.getElementById('copyrightRightsText').textContent = dictionary.allRights;
            
            // Modals translation
            document.getElementById('modalDisclaimerTitle').textContent = dictionary.modalDisclaimerTitle;
            document.getElementById('modalDisclaimerBody').innerHTML = dictionary.modalDisclaimerContent;
            document.getElementById('modalDisclaimerCloseBtn').textContent = dictionary.modalDisclaimerClose;
            
            document.getElementById('modalPrivacyTitle').textContent = dictionary.modalPrivacyTitle;
            document.getElementById('modalPrivacyBody').innerHTML = dictionary.modalPrivacyContent;
            document.getElementById('modalPrivacyCloseBtn').textContent = dictionary.modalPrivacyClose;
        }

        // Render chosen forex pair report
        function renderForexReport() {
            const pairSelect = document.getElementById('pairSelect');
            const selectedPair = pairSelect.value;
            const data = forexData[selectedPair];
            const dict = i18n[currentLang];
            
            if (!data) return;
            
            // 1. Render report header (interactive values)
            const biasTranslated = dict[data.bias] || data.bias;
            
            const headerHTML = `
                <div class="pair-info">
                    <div class="pair-icon-wrapper">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="pair-name">${selectedPair}</h2>
                        <div class="pair-quote">${dict.quoteLabel}: <span id="currentQuoteVal">${data.quote}</span></div>
                    </div>
                </div>
                <div class="bias-badge bias-${data.biasType}">
                    ${biasTranslated}
                </div>
            `;
            document.getElementById('reportHeader').innerHTML = headerHTML;
            
            // 2. Render localized detail contents
            const details = data[currentLang];
            
            document.getElementById('reportFundamental').textContent = details.fundamental;
            document.getElementById('reportTrend').textContent = details.trend;
            document.getElementById('reportSupport').textContent = details.support;
            document.getElementById('reportResistance').textContent = details.resistance;
            document.getElementById('reportPriceAction').textContent = details.priceAction;
            
            // 3. Render strategic setup
            const recTranslated = dict[details.recommendation] || details.recommendation;
            
            // Color theme class map for verdict card
            const cardEl = document.getElementById('verdictCardElement');
            const badgeEl = document.getElementById('reportVerdictBadge');
            
            cardEl.className = 'verdict-card';
            badgeEl.className = 'verdict-badge';
            
            if (details.recommendation.includes("AGUARDAR") || details.recommendation.includes("WAIT")) {
                cardEl.classList.add('verdict-wait');
                badgeEl.classList.add('wait');
            } else if (details.recommendation.includes("VENDA") || details.recommendation.includes("SELL")) {
                cardEl.classList.add('verdict-sell');
                badgeEl.classList.add('sell');
            } else {
                cardEl.classList.add('verdict-buy');
                badgeEl.classList.add('buy');
            }
            
            badgeEl.textContent = recTranslated;
            
            document.getElementById('reportTrigger').textContent = details.trigger;
            document.getElementById('reportStop').textContent = details.stop;
            document.getElementById('reportTarget').textContent = details.target;
            document.getElementById('reportRR').textContent = details.rr;
            
            // R&R Progress Bar logic
            document.getElementById('reportRRText').textContent = details.rr;
            document.getElementById('reportRRBar').style.width = `${data.rrValue}%`;
            
            document.getElementById('reportJustification').textContent = details.justification;
            
            // Display container with smooth fade in
            const reportContainer = document.getElementById('reportContainer');
            reportContainer.style.display = 'block';
        }

        /* ==========================================
           D. Interactive Event Listeners & Modals
           ========================================== */
        // Smooth scroll to donations for high CRO
        function scrollToDonation() {
            const section = document.getElementById('donationSection');
            if (section) {
                section.scrollIntoView({ behavior: 'smooth', block: 'center' });
                // Subtle attention trigger on the donation card
                section.style.transition = 'transform 0.3s ease';
                section.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    section.style.transform = 'scale(1)';
                }, 300);
            }
        }

        // Elegant Light-weight Modals (Compliance Essentials)
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden'; // Lock background scroll
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
                document.body.style.overflow = ''; // Unlock scroll
            }
        }

        function closeModalOnOutsideClick(event, modalId) {
            if (event.target.id === modalId) {
                closeModal(modalId);
            }
        }

        // Initialize Core System Actions
        window.addEventListener('DOMContentLoaded', () => {
            initLanguageDetection();
            translateUI();
            renderForexReport();
            
            // Pair Change event
            document.getElementById('pairSelect').addEventListener('change', renderForexReport);
            
            // Language Select event
            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLang = e.target.value;
                translateUI();
                renderForexReport();
            });
        });
    </script>
